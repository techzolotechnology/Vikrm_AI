# Production Docker Compose.
#
# Differs from docker-compose.yml (development) in the ways that
# actually matter for a real deployment:
# - Builds Dockerfile.prod (multi-stage, non-root, no dev reload)
#   instead of the dev Dockerfiles.
# - No source-code bind mounts — the image is immutable; redeploy by
#   rebuilding, not by editing files live inside a running container.
# - Frontend is served by Nginx (static build + reverse proxy),
#   not the Vite dev server.
# - Every service has a real healthcheck and `restart: unless-stopped`.
# - No exposed ports for internal-only services (MySQL, Redis, ChromaDB
#   run embedded in the backend) beyond what the frontend's Nginx and
#   Ollama (if used remotely) need.
#
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: vikrm-prod

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - vikrm_ollama_data:/root/.ollama
    networks:
      - vikrm-network
    # Not exposed to the host by default in production — only the
    # backend (on the same Docker network) needs to reach it.

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - vikrm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vikrm-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - vikrm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vikrm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - vikrm_chroma_data:/app/data/chroma
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vikrm-network
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vikrm-network

networks:
  vikrm-network:
    driver: bridge

volumes:
  vikrm_mysql_data:
  vikrm_redis_data:
  vikrm_ollama_data:
  vikrm_chroma_data:
